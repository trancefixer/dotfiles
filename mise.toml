# ~/.config/mise/config.toml or your dotfiles repo mise.toml

[tools]
# Automatically ensures chezmoi is installed and on your PATH
chezmoi = "latest"

[env]
# Optional: Explicitly point chezmoi to a specific source directory if needed
CHEZMOI_SOURCE_DIR = "{{ config_root }}"

[tasks.setup]
description = "Install dependencies and link dotfiles"
run = "chezmoi apply"

[tasks.update]
description = "Pull latest dotfile changes and re-apply"
run = """
git pull origin main
chezmoi apply
"""

[tasks.health]
description = "Verify symlinks and environment setup"
run = "chezmoi doctor"

[tasks."dotfiles:apply"]
description = "Apply chezmoi target state to home directory"
run = "chezmoi apply"

[tasks."dotfiles:diff"]
description = "Preview unapplied dotfile changes"
run = "chezmoi diff"

[tasks."dotfiles:update"]
description = "Pull latest dotfiles from Git and apply changes"
run = "chezmoi update"

[tasks."dotfiles:status"]
description = "Check git status of chezmoi source directory"
run = "chezmoi status"
